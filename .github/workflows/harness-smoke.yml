name: Harness Smoke
on:
  pull_request:
    paths: ['cli/src/**', '.agents/workflows/**', 'skills/specialists/**', 'scripts/harness-smoke/**', '.github/workflows/harness-smoke.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-invalid
      OPENAI_BASE_URL: http://127.0.0.1:1
      ANTHROPIC_API_KEY: sk-ant-invalid
      ANTHROPIC_BASE_URL: http://127.0.0.1:1
      DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20.x' }
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g @openai/codex@0.157.1 opencode-ai@1.18.32
      - run: gh --version
      - run: pnpm harness:smoke --write
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: round-trip-results, path: docs/round-trip-results.md }
