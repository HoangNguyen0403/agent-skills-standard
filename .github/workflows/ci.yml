name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans commits, not just the working tree

      - name: Install gitleaks (pinned, OSS CLI — not the licensed gitleaks-action wrapper)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --verbose

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Vulnerabilities
        run: pnpm audit --prod

      - name: Check Formatting (Prettier)
        run: pnpm format

      - name: Linting (ESLint)
        run: pnpm lint

      - name: Type Check & Build
        run: pnpm build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Unit Tests with Coverage
        run: pnpm test:cov
      - name: Run E2E Tests
        run: pnpm test:e2e

  validate-skills:
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI for validation
        run: pnpm build

      - name: Validate skill format and structure
        run: pnpm validate

      - name: SDLC Workflow Schema Audit
        run: pnpm audit:sdlc

      - name: Prompt Injection Scan
        run: pnpm audit:injection

      - name: Eval Alignment Gate
        run: pnpm check-alignment

      - name: Live Eval Run Verification
        run: pnpm evals:verify -- --all

      - name: Documentation Coverage Scan
        run: pnpm docs:scan

      - name: Validate release tag prefixes
        run: pnpm verify:release-tags

      - name: Check if Token Metrics are in-sync
        run: |
          pnpm calculate-tokens
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Token metrics or README are out of sync! Please run 'pnpm calculate-tokens' locally and commit the changes."
            git status --porcelain
            exit 1
          fi
          echo "✅ Token metrics are synchronized."
