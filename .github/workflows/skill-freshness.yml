# .github/workflows/skill-freshness.yml
name: Skill Freshness Check

# Weekly drift check. Two independent bands:
#  1. Upstream pins: compares every pin in skills/metadata.json (and per-skill
#     metadata.upstream) against the latest GitHub release/tag, publishing
#     benchmarks/freshness/ as an artifact and step summary. A red run means at
#     least one upstream shipped a new major; see docs/FRESHNESS.md
#     "Reviewing a category".
#  2. Benchmark regression: `pnpm benchmark:gate` compares the current corpus
#     against the most recent benchmarks/history.json record and fails on token
#     growth, quality drop, or a savings collapse. This band lives here rather
#     than in the PR gate because it measures corpus drift over time, not the
#     content of any single diff.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, an hour after skillspector-scan
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days before a pin's reviewed date counts as stale"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  check:
    name: Upstream drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Freshness check (audit + GitHub upstream)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '120' }}
        run: pnpm freshness:check --internal --stale-days "$STALE_DAYS"
        continue-on-error: true

      - name: Publish step summary
        if: always()
        run: |
          if [ -f benchmarks/freshness/freshness-report.md ]; then
            cat benchmarks/freshness/freshness-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No freshness report was produced (the check step failed before writing it)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshness-report
          path: benchmarks/freshness/
          retention-days: 90

      - name: Fail on high-severity drift
        if: always()
        run: |
          if [ ! -f benchmarks/freshness/freshness-report.json ]; then
            echo "::error::freshness:check did not produce a report; see the check step log."
            exit 1
          fi
          HIGH=$(node -e 'process.stdout.write(String(require("./benchmarks/freshness/freshness-report.json").summary.bySeverity.high))')
          if [ "$HIGH" != "0" ]; then
            echo "::error::$HIGH upstream major drift issue(s) — open the step summary for the affected categories."
            exit 1
          fi

      - name: Benchmark regression gate
        if: always()
        run: pnpm benchmark:gate
