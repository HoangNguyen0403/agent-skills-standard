[extend]
useDefault = true

[[allowlists]]
description = "Educational example code in skill reference docs — same false-positive source SkillSpector already excludes references/ for. Historical example credentials (e.g. API_KEY=prod_key_67890) look like real secrets to entropy-based rules but were never real."
paths = [
  '''skills/.+/references/.+\.md$''',
]
# The placeholder itself, wherever git history surfaces it. The paths rule above
# covers the example file it came from, but the CHANGELOG entry that documented
# that rule quotes the placeholder verbatim, so every PR re-detects it on the
# full-history scan. Scoped to this one known-fake literal, not to CHANGELOG.md,
# so a real secret committed there is still caught.
regexes = [
  '''prod_key_67890''',
]

# `generic-api-key` matches the shape `<something>-api/key` + `: "<entropy>"`.
# Content-addressed evidence artifacts have exactly that shape while holding no
# credentials: a path and a SHA-256 digest. Every entry below is `condition = "AND"`
# so the path narrows where the literal shape is expected — it must never be a
# blanket allow. `regexTarget = "match"` is required: the default target is the
# captured secret (the digest), which no pattern can tell apart from a real key.
[[allowlists]]
description = "Pre-integration SHA-256 digest manifest: `\"<path containing api/key>\": \"<64-hex digest>\"` is a file hash, not a credential."
condition = "AND"
paths = [
  '''artifacts/runs/.+/pre-integration-snapshot\.json$''',
]
regexTarget = "match"
regexes = [
  '''[^"]+"\s*:\s*"[a-f0-9]{64}"''',
]

[[allowlists]]
description = "Eval audit metadata: `laneKeyHash` is a SHA-256 lane identifier, not a key."
condition = "AND"
paths = [
  '''artifacts/.+\.audit\.json$''',
]
regexTarget = "match"
regexes = [
  '''laneKeyHash[^:]*\s*:\s*"[a-f0-9]{64}"''',
]

[[allowlists]]
description = "Unit-test fixture: the fake credentials below are asserted to be stripped by getSanitizedEnv(). Literal-scoped, so the same values anywhere else stay detectable."
condition = "AND"
paths = [
  '''cli/src/services/harness/__tests__/HarnessDiscoveryService\.spec\.ts$''',
]
regexes = [
  '''secret_key_12345''',
  '''top_secret''',
  '''password123''',
]

[[allowlists]]
description = "Diagnostic prevention baseline declared SHA-256 digest manifests: file hashes matching generic-api-key shape in sealed evidence artifacts."
condition = "AND"
paths = [
  '''^artifacts/diagnostic-prevention/implementation/attempt-01/root-scale-r1-full-03/baseline-declared-digests\.json$''',
  '''^artifacts/diagnostic-prevention/implementation/attempt-01/root-scale-r1-prerequisites-03/baseline-declared-digests\.json$''',
]
regexTarget = "match"
regexes = [
  '''orders_api\.py"?\s*:\s*"02cae4c9aacce387ee00619989c5bd3338e5abe5365542fbfa8a323729b53f38''',
  '''api-error-contract\.md"?\s*:\s*"91e65461819f57150176446a73079bc968e6a1b4d5a980a56bf7cbc6bf81d224''',
  '''owasp-api\.md"?\s*:\s*"b6844ad13dddf7c341fb4454ba51b6111eb89b3e23b9ec10f7822ad995b3b84b''',
  '''smartbear-api\.md"?\s*:\s*"fab7799f729491aab0131dd6a5db8614b003009c034723eafd22b9d0a23583ab''',
]
