[extend]
useDefault = true

[allowlist]
description = "Educational example code in skill reference docs — same false-positive source SkillSpector already excludes references/ for. Historical example credentials (e.g. API_KEY=prod_key_67890) look like real secrets to entropy-based rules but were never real."
paths = [
  '''skills/.+/references/.+\.md$''',
]
# The placeholder itself, wherever git history surfaces it. The paths rule above
# covers the example file it came from, but the CHANGELOG entry that documented
# that rule quotes the placeholder verbatim, so every PR re-detects it on the
# full-history scan. Scoped to this one known-fake literal, not to CHANGELOG.md,
# so a real secret committed there is still caught.
regexes = [
  '''prod_key_67890''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public non-secret SHA256 laneKeyHash in marketing-audience-research baseline audit"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)artifacts/evidence-led-marketing/stopped-evaluation/answers/marketing-audience-research/eval-1\.baseline\.audit\.json$''',
]
regexes = [
  '''(?m)^  "laneKeyHash": "0cb3a5820063c067794b1395465a7c593393a3d8c5135733e39557add0e7575f",$''',
]

[[rules.allowlists]]
description = "Public non-secret SHA256 laneKeyHash in marketing-audience-research with-skill audit"
condition = "AND"
regexTarget = "line"
paths = [
  '''(?:^|/)artifacts/evidence-led-marketing/stopped-evaluation/answers/marketing-audience-research/eval-1\.with-skill\.audit\.json$''',
]
regexes = [
  '''(?m)^  "laneKeyHash": "e5d94854ced6aeed6ca525e95b405a66759b9c511e55ab5c0a4bbc103d26dd82",$''',
]
